# /etc/nginx/sites-available/mdpravo.ru  — пример; сертификат через certbot
server {
    listen 80;
    listen [::]:80;
    server_name mdpravo.ru www.mdpravo.ru;
    return 301 https://mdpravo.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.mdpravo.ru;
    ssl_certificate     /etc/letsencrypt/live/mdpravo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mdpravo.ru/privkey.pem;
    return 301 https://mdpravo.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mdpravo.ru;

    ssl_certificate     /etc/letsencrypt/live/mdpravo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mdpravo.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # чуть больше лимита загрузки в приложении (UPLOAD_MAX_MB=20)
    client_max_body_size 22m;

    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/xml application/json application/manifest+json;

    # шаблоны документов старого сайта — статикой
    location /downloads/ { root /opt/mdpravo/current/public; access_log off; expires 7d; }
    location /documents/ { root /opt/mdpravo/current/public; access_log off; expires 7d; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
